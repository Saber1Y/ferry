[package]
name = "ferry-app"
version = "0.1.0"
description = "FERRY desktop app: move your ZEC from Orchard to Ironwood privately"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ferry_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
ferry-core = { path = "../../crates/ferry-core" }
log = "0.4"
secrecy.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9.2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = "2.5"
tokio.workspace = true
